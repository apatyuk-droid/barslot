<head>

<title>Бар-слот Barinoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Marck+Script&family=Oswald:wght@500;600&family=PT+Sans+Narrow:wght@400;700&display=swap">
<style>
/* Night bar + Barinoff label language. Single deliberate dark look.
   Layout: one phone column — logo, title, label-shaped machine with three reels, mixed-cocktail result. */
:root {
  color-scheme: dark;
  --night: #070405;
  --panel: #140c0b;
  --gold: #c2a165;
  --gold-dim: rgba(194,161,101,.45);
  --gold-faint: rgba(194,161,101,.28);
  --ivory: #f2eadb;
  --ink: #4e453d;
  --red: #d0141f;
  --red-hi: #ff3b46;
  --muted: #a8988a;
  --row: 104px;
  --f-title: "Cormorant Garamond", Georgia, serif;
  --f-cond: "Oswald", "Arial Narrow", sans-serif;
  --f-narrow: "PT Sans Narrow", "Arial Narrow", sans-serif;
  --f-script: "Marck Script", cursive;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--night); color: var(--ivory); font-family: var(--f-narrow); padding-inline: 16px; padding-block: 22px 28px; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.app { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.brandrow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.rule { height: 4px; border-top: 1px solid var(--gold-dim); border-bottom: 1px solid var(--gold-dim); }
.logo { height: 44px; width: auto; display: block; border: 1px solid var(--gold); box-shadow: 0 0 0 3px #050304, 0 0 0 4px var(--gold-dim), 0 8px 20px rgba(0,0,0,.7); }
h1 { margin: 0; font-family: var(--f-title); font-weight: 500; font-size: clamp(42px, 13vw, 54px); line-height: .95; text-align: center; text-transform: uppercase; color: #fff; text-shadow: 0 0 30px rgba(255,120,90,.18); }
.under { width: 150px; height: 1px; background: var(--gold-dim); margin: 6px auto 0; }
.script { margin: -2px 0 0; font-family: var(--f-script); font-size: 30px; text-align: center; color: var(--gold); transform: rotate(-3deg); }

/* machine = bottle label */
.label-wrap { position: relative; border-radius: 10px; padding: 14px 18px; background: #5e0f18; box-shadow: 0 30px 60px -20px rgba(0,0,0,.9), 0 0 0 1px rgba(0,0,0,.6); overflow: hidden; }
.label-wrap::before, .label-wrap::after { content: ""; position: absolute; top: 0; bottom: 0; width: 10px; background: #050304; z-index: 2; }
.label-wrap::before { left: 0; } .label-wrap::after { right: 0; }
#damask { position: absolute; inset: 0; width: 100%; height: 100%; }
.card { position: relative; z-index: 1; background: linear-gradient(180deg, #1b110f, var(--panel)); border: 1px solid var(--gold-dim);
  box-shadow: inset 0 0 0 4px var(--panel), inset 0 0 0 5px var(--gold-faint), 0 8px 18px rgba(0,0,0,.6);
  padding: 12px 8px; display: flex; flex-direction: column; gap: 10px; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols > * + * { border-left: 1px solid var(--gold-faint); }
.head { text-align: center; padding: 0 4px 8px; font-family: var(--f-cond); font-weight: 500; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--red-hi); line-height: 1.15; border-bottom: 1px solid var(--gold-faint); }
.head span { display: block; font-family: var(--f-narrow); font-size: 9.5px; letter-spacing: .14em; color: var(--muted); }

.reels { position: relative; }
.reel { position: relative; height: calc(var(--row) * 3); overflow: hidden; cursor: pointer; outline: none; }
.reel:focus-visible { box-shadow: inset 0 0 0 2px var(--gold); }
.strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.strip.dim { opacity: .3; filter: blur(2px); }
.reel.spinning .strip.dim { filter: blur(3px); }
.window { position: absolute; left: 0; right: 0; top: var(--row); height: var(--row); overflow: hidden; z-index: 2; }
.reel.spinning .window .strip { filter: blur(1.2px); }
.cell { height: var(--row); padding: 4px 5px; }
.tag { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 6px 5px;
  background: linear-gradient(180deg, #f7f0e3, var(--ivory) 60%, #e6dcc8); color: var(--ink);
  box-shadow: inset 0 0 0 1px #a99a85, inset 0 0 0 4px var(--ivory), inset 0 0 0 5px rgba(150,135,115,.55); }
.window .tag { box-shadow: inset 0 0 0 1px #a99a85, inset 0 0 0 4px var(--ivory), inset 0 0 0 5px rgba(150,135,115,.55), 0 8px 20px rgba(0,0,0,.7); }
.tag .ico { width: 64%; height: 46px; flex: none; display: block; }
.tag .nm { font-family: var(--f-cond); font-weight: 500; font-size: 10px; letter-spacing: .07em; line-height: 1.1; text-transform: uppercase; color: var(--red); text-align: center; overflow-wrap: break-word; }
.fade { position: absolute; left: 0; right: 0; height: 34px; z-index: 3; pointer-events: none; }
.fade.t { top: 0; background: linear-gradient(var(--panel), rgba(20,12,11,0)); }
.fade.b { bottom: 0; background: linear-gradient(rgba(20,12,11,0), var(--panel)); }
.payline { position: absolute; left: -8px; right: -8px; height: 1px; background: rgba(255,59,70,.75); z-index: 4; box-shadow: 0 0 8px rgba(255,59,70,.6); pointer-events: none; }
.payline.t { top: calc(var(--row) - 1px); } .payline.b { top: calc(var(--row) * 2); }

.btns { gap: 0; }
.btn { appearance: none; cursor: pointer; height: 42px; margin: 0 5px; border-radius: 999px; position: relative;
  font-family: var(--f-cond); font-weight: 500; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #fff;
  background: linear-gradient(180deg, #e8222e, var(--red) 55%, #9d0b14); border: 1px solid rgba(255,255,255,.4);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 0 18px rgba(208,20,31,.45), 0 6px 14px rgba(0,0,0,.6); transition: transform .08s; }
.btn::before { content: ""; position: absolute; left: 10px; right: 10px; top: 3px; height: 38%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0)); pointer-events: none; }
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.btn:disabled { cursor: default; color: var(--gold); background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border-color: var(--gold-dim); box-shadow: inset 0 1px 0 rgba(255,255,255,.15); }
.btn:disabled::before { background: none; }
.btns .btn + .btn { border-left: 1px solid rgba(255,255,255,.4); }
.btns .btn:disabled + .btn:disabled, .btns .btn:disabled { border-left-color: var(--gold-dim); }
.fine { margin: 0; font-size: 11px; line-height: 1.3; color: var(--muted); text-align: center; padding: 0 6px; }
.fine b { color: var(--red-hi); font-weight: 700; letter-spacing: .06em; }

.result { position: relative; background: linear-gradient(180deg, #1b110f, var(--panel)); border: 1px solid var(--gold-dim);
  box-shadow: inset 0 0 0 4px var(--panel), inset 0 0 0 5px var(--gold-faint), 0 16px 30px -10px rgba(0,0,0,.9);
  display: grid; grid-template-columns: 108px minmax(0, 1fr); min-height: 120px; }
.result .big { display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--gold-faint); padding: 10px; }
.ph { width: 86px; height: 96px; padding: 8px; background: linear-gradient(180deg, #f7f0e3, var(--ivory) 60%, #e6dcc8); color: var(--ink);
  box-shadow: inset 0 0 0 1px #a99a85, inset 0 0 0 3px var(--ivory), inset 0 0 0 4px rgba(150,135,115,.55); display: flex; align-items: center; justify-content: center; }
.ph svg { width: 100%; height: 100%; display: block; }
.result .txt { padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; justify-content: center; min-width: 0; }
.k { font-size: 10px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
.v { font-family: var(--f-cond); font-weight: 500; font-size: 15px; letter-spacing: .03em; color: var(--ivory); line-height: 1.25; }
.v em { font-style: normal; color: var(--gold); }
.recipe { font-size: 12px; color: var(--muted); line-height: 1.3; }
.wait { font-size: 14px; color: var(--muted); line-height: 1.35; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ghostbtn { appearance: none; cursor: pointer; height: 44px; border-radius: 999px; font-family: var(--f-cond); font-weight: 500; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--gold); background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border: 1px solid var(--gold-dim); box-shadow: inset 0 1px 0 rgba(255,255,255,.15); }
.ghostbtn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.ghostbtn:disabled { opacity: .4; cursor: default; }

@media (max-width: 360px) { :root { --row: 98px; } .tag .nm { font-size: 9px; } .head { font-size: 11px; } .btn { font-size: 12px; letter-spacing: .08em; } }
@media (prefers-reduced-motion: reduce) { .reel.spinning .strip.dim, .reel.spinning .window .strip { filter: blur(2px); } }
</style>

</head>

  Reel.prototype.spin = function () { this.state = "spin"; this.result = null; this.el.classList.add("spinning"); this.btn.disabled = false; this.btn.textContent = "Стоп"; };

  };

  var reels = [0, 1, 2].map(function (i) { return new Reel(i); });
  fitIcons(document);

  var audio = null;
  function tick(f, len, d) { try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); var t = audio.currentTime + (d || 0), o = audio.createOscillator(), g = audio.createGain();

  function haptic(kind) { try { if (tg && tg.HapticFeedback) { kind === "done" ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred("medium"); } else if (navigator.vibrate) navigator.vibrate(kind === "done" ? [20, 50, 20] : 12); } catch (e) {} }

  var mixEl = document.getElementById("mix"), waitEl = document.getElementById("wait"), comboEl = document.getElementById("combo"), recipeEl = document.getElementById("recipe");
  var copyBtn = document.getElementById("copy"), againBtn = document.getElementById("again"), shareText = "";

  function emptyGlass() { mixEl.innerHTML = '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity=".5">' + GLASS.highball.o + '</svg>'; }
  emptyGlass();

  function stopReel(i) { if (reels[i].stop(performance.now())) { tick(660, 0.05); haptic(); } }
  function onStopped() {
    tick(990, 0.05);
    var left = reels.filter(function (r) { return r.state !== "stopped"; }).length;
    if (left) { waitEl.textContent = left === 2 ? "Осталось остановить два барабана." : "Остался последний барабан."; return; }
    var b = reels[0].result, s = reels[1].result, g = reels[2].result, vol = VOLUME[g[0]];
    mixEl.innerHTML = mixSvg(b[0], s[0], g[0]); var ms = mixEl.querySelector("svg"); ms.classList.add("ico"); fitIcons(mixEl);
    comboEl.innerHTML = b[1] + "<br>+ " + s[1] + " <em>Gold Label</em><br>" + SERVE_TEXT[g[0]];
    recipeEl.textContent = vol[0] + " мл сиропа + " + vol[1] + " мл основы, лёд по вкусу";
    waitEl.hidden = true; comboEl.hidden = false; recipeEl.hidden = false;
    shareText = "🍹 Мой моктейль из бар-слота Barinoff: " + b[1].toLowerCase() + " + сироп " + s[1].toLowerCase() + " Gold Label " + SERVE_TEXT[g[0]] + ".";
    copyBtn.disabled = false; copyBtn.textContent = "Скопировать"; againBtn.disabled = false;
    haptic("done"); tick(660, .08, .05); tick(990, .12, .16);
  }
  function spinAgain() {
    reels.forEach(function (r) { r.spin(); });
    emptyGlass(); waitEl.textContent = "Барабаны крутятся. Останови все три, и здесь появится твой напиток.";
    waitEl.hidden = false; comboEl.hidden = true; recipeEl.hidden = true; copyBtn.disabled = true; againBtn.disabled = true; tick(520, .05);
  }
  reels.forEach(function (r, i) {
    r.btn.addEventListener("click", function () { stopReel(i); });
    r.el.addEventListener("click", function () { stopReel(i); });
    r.el.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); stopReel(i); } });
  });
  againBtn.addEventListener("click", spinAgain);
  copyBtn.addEventListener("click", function () {
    function fallback() { var rg = document.createRange(); rg.selectNodeContents(comboEl); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg); copyBtn.textContent = "Выделено"; }
    try { navigator.clipboard.writeText(shareText).then(function () { copyBtn.textContent = "Скопировано"; }, fallback); } catch (e) { fallback(); }
  });
  document.addEventListener("keydown", function (e) { if (e.target && e.target.classList && e.target.classList.contains("reel")) return; if (e.key === "1" || e.key === "2" || e.key === "3") stopReel(+e.key - 1); });

  var last = performance.now();
  (function frame(now) { var dt = Math.min(.05, (now - last) / 1000); last = now; reels.forEach(function (r) { r.update(now, dt); }); requestAnimationFrame(frame); })(last);

  // night-bar backdrop
  var seed = 11; function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  function drawBg() {
    var c = document.getElementById("bg"), dpr = Math.min(2, window.devicePixelRatio || 1), W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr, g = c.getContext("2d");
    seed = 11;
    var grd = g.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, "#1a0709"); grd.addColorStop(.45, "#0c0506"); grd.addColorStop(1, "#050304");
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    var cols = ["255,170,90", "255,120,80", "220,40,60", "255,210,150", "180,60,140", "90,140,200"];
    g.globalCompositeOperation = "lighter";
    for (var i = 0; i < 60; i++) { var x = rnd() * W, y = rnd() * H * .6, r = (14 + rnd() * 46) * dpr, col = cols[Math.floor(rnd() * cols.length)], a = .05 + rnd() * .12;
      var rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, "rgba(" + col + "," + a + ")"); rg.addColorStop(.7, "rgba(" + col + "," + a * .7 + ")"); rg.addColorStop(1, "rgba(" + col + ",0)");
      g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
    g.globalCompositeOperation = "source-over";
    var sp = g.createRadialGradient(W / 2, H * .06, 0, W / 2, H * .06, W * .7); sp.addColorStop(0, "rgba(208,20,31,.22)"); sp.addColorStop(1, "rgba(208,20,31,0)");
    g.fillStyle = sp; g.fillRect(0, 0, W, H * .35);
  }
  function drawDamask() {
    var c = document.getElementById("damask"), r = c.getBoundingClientRect(), W = c.width = Math.max(1, r.width * 2), H = c.height = Math.max(1, r.height * 2), g = c.getContext("2d");
    var grd = g.createLinearGradient(0, 0, W, H); grd.addColorStop(0, "#4a0b12"); grd.addColorStop(.5, "#64101a"); grd.addColorStop(1, "#3a080e");
    g.fillStyle = grd; g.fillRect(0, 0, W, H); g.lineCap = "round";
    function scroll(x, y, s, flip) { g.save(); g.translate(x, y); g.scale(flip ? -s : s, s); g.beginPath();
      g.moveTo(0, 0); g.bezierCurveTo(20, -30, 60, -30, 60, 0); g.bezierCurveTo(60, 22, 34, 26, 30, 8); g.bezierCurveTo(28, -2, 42, -6, 44, 4);
      g.moveTo(0, 0); g.bezierCurveTo(-10, 30, 10, 60, 40, 58); g.bezierCurveTo(56, 56, 58, 40, 46, 38);
      g.moveTo(10, -14); g.bezierCurveTo(0, -40, -30, -44, -36, -20); g.bezierCurveTo(-40, -6, -24, 0, -20, -10);
      g.moveTo(30, 58); g.quadraticCurveTo(20, 80, 36, 96); g.stroke(); g.beginPath(); g.ellipse(62, 30, 10, 4, .8, 0, Math.PI * 2); g.fill(); g.restore(); }
    for (var y = -40; y < H + 80; y += 120) for (var x = -40; x < W + 80; x += 140) { var ox = (Math.round(y / 120) % 2) * 70;
      g.strokeStyle = "rgba(150,30,42,.85)"; g.fillStyle = "rgba(150,30,42,.7)"; g.lineWidth = 7; scroll(x + ox, y, .9, false); scroll(x + ox + 1, y, .9, true);
      g.strokeStyle = "rgba(200,60,70,.35)"; g.fillStyle = "rgba(200,60,70,.25)"; g.lineWidth = 2; scroll(x + ox, y, .9, false); scroll(x + ox + 1, y, .9, true); }
    var v = g.createRadialGradient(W / 2, H / 2, W * .2, W / 2, H / 2, W * .8); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.55)"); g.fillStyle = v; g.fillRect(0, 0, W, H);
  }
  drawBg(); drawDamask();
  var rt; addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { drawBg(); drawDamask(); }, 150); });
})();
